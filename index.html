<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempleYatra - Indian Temples Directory, Timings, Routes & Hotels</title>
  <meta name="description" content="Explore famous Hindu temples across India with darshan timings, nearest railway stations, airports, Google Maps routes, and hotel bookings." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fdf8f4;
      color: #2b2118;
    }
    header {
      background: linear-gradient(135deg, #d94e1f, #ff7b00);
      color: #fff;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 { margin: 0 0 6px; font-size: 26px; }
    header p { margin: 0; font-size: 14px; opacity: 0.95; }

    .controls {
      max-width: 1200px;
      margin: 18px auto 10px;
      padding: 0 16px;
    }
    #searchBox {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #e0cbb8;
      border-radius: 25px;
      outline: none;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    #searchBox:focus { border-color: #ff6b00; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .filters button {
      padding: 7px 14px;
      border: 1px solid #e0cbb8;
      background: #fff;
      color: #4a3525;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filters button:hover,
    .filters button.active {
      background: #ff6b00;
      color: #fff;
      border-color: #ff6b00;
    }

    .status-bar {
      max-width: 1200px;
      margin: 8px auto;
      padding: 0 16px;
      font-size: 13px;
      color: #6b5344;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid {
      max-width: 1200px;
      margin: 12px auto 24px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #efe0d3;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f3e5d8;
    }
    .card-body {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-body h4 { margin: 0 0 4px; font-size: 16px; color: #1f160f; }
    .card-body p { margin: 3px 0; color: #5c4738; }

    .btn {
      margin-top: auto;
      padding: 9px 14px;
      background: #ff6b00;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #e05a00; }

    .btn2 {
      padding: 10px 18px;
      background: #1a73e8;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
    }

    #pagination {
      text-align: center;
      margin: 20px 0 36px;
    }
    #pagination button {
      padding: 10px 24px;
      background: #2b2118;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
      padding: 16px;
      overflow-y: auto;
    }
    #modalBox {
      background: #fff;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 16px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    #modalBox h3 { margin-top: 0; padding-right: 36px; }
    #modalBox p { line-height: 1.6; font-size: 14px; color: #3d2e24; }

    footer {
      text-align: center;
      padding: 20px 16px;
      border-top: 1px solid #ead8c8;
      font-size: 13px;
      color: #6b5344;
    }
    footer a { color: #d94e1f; text-decoration: none; margin: 0 6px; }
  </style>
</head>
<body>

<header>
  <h1>🛕 TempleYatra</h1>
  <p>Discover Sacred Temples Across India — Timings, Routes & Stays</p>
</header>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Search by temple name, city, or state..." onkeyup="resetRender()" />
  <div class="filters" id="stateFilters">
    <button class="active" onclick="filterState('All', this)">All States</button>
    <!-- State buttons are auto-generated from your temples list below -->
  </div>
</div>

<div class="status-bar">
  <span id="count">Loading temples...</span>
  <span>Showing <strong id="shown">0</strong> / <strong id="total">0</strong></span>
</div>

<div class="grid" id="grid"></div>

<div id="pagination">
  <button onclick="loadMore()">Load More Temples</button>
</div>

<div id="modal">
  <div id="modalBox"></div>
</div>

<footer>
  <p>
    <a href="about.html">About Us</a> |
    <a href="contact.html">Contact Us</a> |
    <a href="privacy-policy.html">Privacy Policy</a>
  </p>
</footer>

<script>
// =========================================================================
// 1. PASTE YOUR FULL 241 TEMPLES ARRAY HERE (replacing the 2 examples below)
// =========================================================================
const temples = [
  {
    id: 1,
    name: "Sri Venkateswara Swamy Temple",
    city: "Tirupati",
    district: "Tirupati",
    state: "Andhra Pradesh",
    timing: "03:00 AM - 11:30 PM",
    rail: "Tirupati Main (22 km)",
    airport: "Tirupati Airport (38 km)",
    lat: 13.6833,
    lon: 79.3472,
    img: "https://wikimedia.org"
  },
  {
    id: 2,
    name: "Meenakshi Amman Temple",
    city: "Madurai",
    district: "Madurai",
    state: "Tamil Nadu",
    timing: "05:00 AM - 12:30 PM, 04:00 PM - 09:30 PM",
    rail: "Madurai Junction (1.5 km)",
    airport: "Madurai Airport (12 km)",
    lat: 9.9195,
    lon: 78.1193,
    img: "https://wikimedia.org"
  }
];

// =========================================================================
// 2. CLEAN PLACEHOLDER IF ANY TEMPLE IMAGE URL IS MISSING OR BROKEN
// =========================================================================
const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://w3.org' width='600' height='400' viewBox='0 0 600 400'%3E%3Crect fill='%23f3e5d8' width='600' height='400'/%3E%3Ctext fill='%23b85d19' font-family='sans-serif' font-size='22' font-weight='bold' x='50%25' y='50%25' text-anchor='middle' dominant-baseline='middle'%3E%F0%9F%9B%95 Temple Photo Coming Soon%3C/text%3E%3C/svg%3E";

// Auto-generate state filter buttons from your data
function initStateButtons() {
  const container = document.getElementById('stateFilters');
  const states = [...new Set(temples.map(t => t.state).filter(Boolean))].sort();
  states.forEach(state => {
    const btn = document.createElement('button');
    btn.textContent = state;
    btn.onclick = function() { filterState(state, btn); };
    container.appendChild(btn);
  });
}

// Dynamic SEO for direct ?temple=ID links
window.addEventListener('load', function() {
  var p = new URLSearchParams(location.search);
  var tid = p.get('temple') || p.get('Temple');
  if (!tid) return;
  var t = temples.find(item => String(item.id) === String(tid));
  if (!t) return;
  document.title = t.name + ' Temple, ' + (t.state || t.location || 'India') + ' - Timings & History | TempleYatra';
  var m = document.querySelector('meta[name="description"]');
  if (m) m.content = t.name + ' Temple in ' + (t.city || '') + '. Check timings, history, route.';
});

let currentState = 'All';
let visibleCount = 24;

function getFiltered() {
  let q = document.getElementById('searchBox').value.toLowerCase();
  return temples.filter(t =>
    (currentState === 'All' || t.state === currentState) &&
    (
      (t.name && t.name.toLowerCase().includes(q)) ||
      (t.city && t.city.toLowerCase().includes(q)) ||
      (t.state && t.state.toLowerCase().includes(q))
    )
  );
}

function render() {
  let filtered = getFiltered();
  let show = filtered.slice(0, visibleCount);
  let html = '';

  show.forEach(t => {
    let imgSrc = (t.img && t.img.trim() !== '') ? t.img : FALLBACK_IMG;
    html += `
      <div class="card">
        <img src="${imgSrc}" alt="${t.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
        <div class="card-body">
          <h4>${t.name}</h4>
          <p style="font-size:12px">📍 ${t.city}, ${t.state}</p>
          <p style="font-size:11px">⏰ ${t.timing} | 🚂 ${t.rail}</p>
          <button class="btn" onclick="openTemple(${t.id})">Route & Hotels</button>
        </div>
      </div>`;
  });

  document.getElementById('grid').innerHTML = html || '<p>No temples found matching your search.</p>';
  document.getElementById('count').innerText = 'Found ' + filtered.length + ' Temples - ' + currentState;
  document.getElementById('shown').innerText = show.length;
  document.getElementById('total').innerText = filtered.length;
  document.getElementById('pagination').style.display = show.length >= filtered.length ? 'none' : 'block';
}

function resetRender() {
  visibleCount = 24;
  render();
}

function loadMore() {
  visibleCount += 24;
  render();
}

function filterState(s, btn) {
  currentState = s;
document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  visibleCount = 24;
  render();
}

function openTemple(id) {
  let t = temples.find(x => x.id === id);
  if (!t) return;
  let imgSrc = (t.img && t.img.trim() !== '') ? t.img : FALLBACK_IMG;
  document.getElementById('modalBox').innerHTML = `<button onclick="document.getElementById('modal').style.display='none'" style="position:absolute;right:14px;top:14px;padding:7px 12px;border:none;background:#ff6b00;color:white;border-radius:20px;cursor:pointer">✕</button><h3>🛕 ${t.name}</h3><img src="${imgSrc}" alt="${t.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'" style="width:100%;border-radius:12px;max-height:300px;object-fit:cover"><p>📍 <strong>Location:</strong> ${t.city}, ${t.district || ''}, ${t.state}<br>⏰ <strong>Timings:</strong> ${t.timing}<br>🚆 <strong>Nearest Railway:</strong> ${t.rail}<br>✈️ <strong>Nearest Airport:</strong> ${t.airport}</p><div style="display:flex;flex-direction:column;gap:10px;margin-top:14px"><a class="btn2" href="https://google.com{t.lat},${t.lon}" target="_blank">📍 Google Map Directions</a><a class="btn" href="https://booking.com{encodeURIComponent(t.city)}&aid=4749214" target="_blank" style="background:#003580;border-radius:20px;padding:10px">🏨 Booking.com Hotels</a><a href="https://wa.me{encodeURIComponent(t.name)}" target="_blank" style="background:#25D366;color:white;padding:10px 18px;border-radius:20px;text-decoration:none;text-align:center;font-weight:600">📱 WhatsApp 8247679346</a></div>`;
  document.getElementById('modal').style.display = 'block';
}

window.onclick = function(e) { if (e.target === document.getElementById('modal')) document.getElementById('modal').style.display = 'none'; };
document.addEventListener('DOMContentLoaded', function() { initStateButtons(); render(); });
</script>
</body>
</html>
