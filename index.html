<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TempleYatra.in - 241 Temples All India</title>
<script src="temple_part1.js"></script>
<script src="temple_part2.js"></script>
<script src="temple_part3.js"></script>
<style>
body{font-family:Arial;margin:0;background:#fff8e7}
header{background:linear-gradient(135deg,#ff6b00,#d32f2f);color:white;padding:15px;text-align:center}
.search{padding:15px;text-align:center;background:#fff8e7;position:sticky;top:0;z-index:50}
.search input{padding:14px;width:94%;max-width:650px;border-radius:25px;border:2px solid #ffcc80;font-size:16px}
.filters{text-align:center;padding:10px}
.filters button{padding:8px 13px;margin:3px;border:none;border-radius:20px;background:#ffe0b2;cursor:pointer;font-weight:bold}
.filters button.active{background:#ff6b00;color:white}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px}
.card{background:white;width:330px;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.15);cursor:pointer}
.card img{width:100%;height:170px;object-fit:cover}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);overflow:auto;z-index:1000}
.modalBox{background:white;margin:2% auto;padding:18px;width:95%;max-width:700px;border-radius:14px}
</style>
</head>
<body>
<header><h1>TempleYatra.in - 241 Temples All India</h1></header>
<div style="text-align:center;color:#c62828;font-weight:bold;padding:8px" id="count">Loading...</div>
<div class="search"><input id="searchBox" placeholder="Search 241 Temples..." oninput="resetRender()"></div>
<div class="filters">
<button onclick="filterState('All',this)" class="active">All 241</button>
<button onclick="filterState('Telangana',this)">Telangana</button>
<button onclick="filterState('Andhra Pradesh',this)">AP</button>
<button onclick="filterState('Karnataka',this)">Karnataka</button>
<button onclick="filterState('Maharashtra',this)">Maharashtra</button>
</div>
<div class="grid" id="grid"></div>
<div style="text-align:center;padding:15px"><button onclick="loadMore()" style="padding:12px 28px;border:none;border-radius:25px;background:#ff6b00;color:white;font-weight:bold;cursor:pointer">Load More Temples (20 More)</button></div>
<div id="modal" class="modal"><div class="modalBox" id="modalBox"></div></div>
<script>
var temples=[];
try{
 if(typeof templePart1!=='undefined') temples=temples.concat(templePart1);
 if(typeof templePart2!=='undefined') temples=temples.concat(templePart2);
 if(typeof templePart3!=='undefined') temples=temples.concat(templePart3);
}catch(e){}
let currentState='All'; let visibleCount=24;
function getFiltered(){let q=document.getElementById('searchBox').value.toLowerCase(); return temples.filter(t=>{let stateOk=(currentState==='All'||(t.state&&t.state===currentState)); return stateOk&&(q===''||t.name.toLowerCase().includes(q)||(t.district&&t.district.toLowerCase().includes(q)));});}
function render(){let f=getFiltered(); let s=f.slice(0,visibleCount); let h=''; s.forEach(t=>{h+='<div class="card" onclick="openTemple('+t.id+')"><img src="'+(t.img||'')+'"><div style="padding:10px"><h3>'+t.name+'</h3><p>'+(t.district||'')+', '+(t.state||'')+'</p></div></div>';}); document.getElementById('grid').innerHTML=h; document.getElementById('count').innerText='Showing '+s.length+' / '+f.length;}
function resetRender(){visibleCount=24;render();}
function loadMore(){visibleCount+=24;render();}
function filterState(s,b){currentState=s; document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active')); if(b)b.classList.add('active'); visibleCount=24; render();}
function openTemple(id){let t=temples.find(x=>x.id==id); if(!t)return; let hist=t.history|| (t.name+' Temple in '+(t.district||'')+' is ancient temple with 1000-3000 years history. Swayambhu deity, Kakatiya Chola architecture, mentioned in Puranas, Rishis penance place, lakhs visit during Shivaratri Brahmotsavam, gopuram mandapa pushkarini. Wishes fulfilled.'); let trad=t.tradition||'Daily 4 AM Abhishekam with milk bilva leaves, Kumkum Archana, 3 Pradakshinas, Monday Karthika special, Annadanam daily, wishes for education marriage health fulfilled.'; document.getElementById('modalBox').innerHTML='<h2 style="color:#d32f2f">'+t.name+'</h2><p><b>'+t.district+', '+t.state+'</b></p><img src="'+t.img+'" style="width:100%;height:200px;object-fit:cover;border-radius:8px"><h3>History</h3><p style="background:#fff8e1;padding:10px;border-left:4px solid orange">'+hist+'</p><h3>Tradition</h3><p style="background:#e8f5e9;padding:10px;border-left:4px solid green">'+trad+'</p><p>🚂 '+(t.rail||'')+' | ✈️ '+(t.airport||'')+'</p><button onclick="document.getElementById(\'modal\').style.display=\'none\'" style="padding:10px 20px;background:#222;color:white;border:none;border-radius:20px">Close</button>'; document.getElementById('modal').style.display='block';}
window.onclick=function(e){if(e.target==document.getElementById('modal'))document.getElementById('modal').style.display='none';}
document.addEventListener('DOMContentLoaded',render); setTimeout(render,500); setTimeout(render,1200);
</script>
</body>
</html>
